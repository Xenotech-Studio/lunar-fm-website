<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>极区复查</title><style>body{margin:25px auto;max-width:1300px;background:#101316;color:#e1e7e9;font:15px system-ui;padding:0 20px}a{color:#8bc9d4}header{display:flex;gap:15px;align-items:center}input{flex:1}select,button{padding:8px;background:#263034;color:white;border:1px solid #667}img{width:100%;margin-top:20px}.old{display:flex;gap:16px}.old a{width:50%}p{line-height:1.8}</style><h1>极区永久阴影区 · 逐帧复查</h1><p>旧版是程序化艺术斑块；新版青蓝区域是 NASA PGDA / LOLA 推导的 PSR（面积大于 1 km²），不是冰探测。模拟晕渲与边界采用相同南极立体投影。配色与细线为艺术处理。</p><header><select id="mode"><option value="forward">最终正向</option><option value="reverse">最终反向</option></select><button id="play">播放</button><input id="position" type="range" min="76" max="91" step="0.5" value="81"><output id="label"></output></header><a id="full"><img id="frame"></a><p><a href="REVIEW.md">历史与验证报告</a> · <a href="forward/frames.json">正向诊断</a> · <a href="reverse/frames.json">反向诊断</a> · <a href="mobile/81.png">手机画面</a></p><h2>历史证据</h2><div class="old"><a href="history/04c35f5.png">04c35f5 · 稀疏噪声斑块<img src="history/04c35f5.png"></a><a href="before/78.png">1c39556 · 平滑蓝晕<img src="before/78.png"></a></div><script>const $=id=>document.getElementById(id);let timer;function show(){let src=$('mode').value+'/'+Number($('position').value)+'.png';$('frame').src=src;$('full').href=src;$('label').value=$('position').value+'%'}$('position').oninput=show;$('mode').onchange=show;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放';return}$('play').textContent='暂停';timer=setInterval(()=>{let n=+$('position').value+($('mode').value==='reverse'?-.5:.5);$('position').value=n<76?91:n>91?76:n;show()},500)};onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){$('position').value=+$('position').value+(e.key==='ArrowLeft'?-.5:.5);show()}};show()</script></html>
