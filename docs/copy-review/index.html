<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>六幕文案 · 逐帧复核</title><style>body{margin:24px;background:#111;color:#ddd;font:14px system-ui}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}img{max-width:100%;max-height:86vh;display:block;margin:auto}input{width:45vw}a{color:#caba95}</style><header><h1>六幕文案 · 逐帧复核</h1><select id="device"><option>desktop</option><option>mobile</option></select><select id="direction"><option>forward</option><option>reverse</option></select><input id="frame" type="range" min="0" value="0"><output id="label"></output><a href="COPY.md">新旧文案</a></header><img id="image" alt="真实浏览器滚动帧"><script>let frames=[];async function load(){const data=await(await fetch(`${device.value}/${direction.value}/frames.json`)).json();frames=data.frames;frame.max=frames.length-1;frame.value=0;show()}function show(){const f=frames[frame.value];image.src=`${device.value}/${direction.value}/${f.storyProgress}.png`;label.textContent=`叙事 ${f.storyProgress}% / 页面 ${(f.scrollProgress*100).toFixed(2)}%`}device.onchange=direction.onchange=load;frame.oninput=show;onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){frame.value=+frame.value+(e.key==='ArrowRight'?1:-1);show()}};load()</script></html>
