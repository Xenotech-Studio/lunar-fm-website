<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>月面过渡逐帧复查</title><style>body{margin:24px auto;max-width:1200px;background:#101215;color:#ece9df;font:16px system-ui;padding:0 16px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}button,select{padding:9px;background:#282b2f;color:inherit;border:1px solid #636363;border-radius:6px}input{flex:1;min-width:200px}img{width:100%;margin-top:16px}p{line-height:1.7;color:#bfbfb8}a{color:#dbcaa6}.links{display:flex;gap:12px;flex-wrap:wrap}h1{font-size:24px}</style><h1>20%–66%：逐帧检查完整序列</h1><p>真实 Chrome / WebGL，1200×800，每 1% 一帧。修复前、修复后正向与反向滚动可在同一进度对照。帧间播放用于检查相机与地理位置连续性，并非性能录像。</p><header><select id="series"><option value="after">修复后 · 正向</option><option value="before">修复前</option><option value="reverse">修复后 · 反向滚轮</option></select><button id="play">连续播放</button><input id="progress" type="range" min="20" max="66" step="1" value="20"><output id="label">20%</output></header><a id="full" target="_blank"><img id="frame" alt="滚动进度截图"></a><p><a href="REVIEW.md">问题与验证记录</a> · <a href="after/frames.json">正向诊断</a> · <a href="reverse/frames.json">反向诊断</a></p><div class="links" id="links"></div><script>const $=id=>document.getElementById(id);let timer;function show(){const n=$('progress').value,s=$('series').value,url=s+'/'+n+'.png';$('label').value=n+'%';$('frame').src=url;$('full').href=url;$('links').replaceChildren(...Array.from({length:47},(_,i)=>{const a=document.createElement('a');a.href=s+'/'+(20+i)+'.png';a.textContent=(20+i)+'%';a.target='_blank';return a}))} $('progress').oninput=show;$('series').onchange=show;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='连续播放';return} $('play').textContent='暂停';timer=setInterval(()=>{$('progress').value=+$('progress').value>=66?20:+$('progress').value+1;show()},650)};onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){$('progress').value=+$('progress').value+(e.key==='ArrowRight'?1:-1);show()}};show()</script></html>
