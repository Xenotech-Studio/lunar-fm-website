<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>月面节奏与清晰度复查</title><style>body{max-width:1500px;margin:24px auto;padding:0 20px;background:#101215;color:#eee;font:15px system-ui}header{display:flex;gap:15px;align-items:center;flex-wrap:wrap}button,select{background:#282b2f;color:#eee;padding:8px;border:1px solid #777}input{flex:1;min-width:180px}.frames{display:flex;gap:10px}figure{margin:20px 0;flex:1;min-width:0}img{width:100%}p{line-height:1.8;color:#bbb}a{color:#d9c196}h1{font-size:25px}</style><h1>月面节奏与清晰度 · 逐帧复查</h1><p>“三版对照”按相同叙事进度排列；时间线拉长后，实际页面滚动百分比有所改变。两旧版原图来自已提交的 transition-review，修复版通过真实 Chrome / WebGL 滚轮重新拍摄。50–56 的三版均为 2.1 米眼高，但机位与构图不同，不能用作同景像素配准或科学分辨率测量。</p><header><select id="mode"><option value="compare">三版清晰度对照 · 叙事进度</option><option value="forward">最终正向 · 实际滚动进度</option><option value="reverse">最终反向 · 实际滚动进度</option></select><button id="play">连续播放</button><input id="pos" type="range" min="38" max="56" value="50"><output id="label"></output></header><div class="frames" id="frames"></div><p><a href="REVIEW.md">根因、节奏设计与验证记录</a> · <a href="sharpness.json">高频对比诊断</a> · <a href="forward/frames.json">正向相机记录</a> · <a href="reverse/frames.json">反向相机记录</a></p><script>const $=id=>document.getElementById(id);let timer;function show(){const n=+$('pos').value,m=$('mode').value;$('label').value=n+'%';const series=m==='compare'?[['04c35f5','../transition-review/before'],['2401762','../transition-review/after'],['修复版','matched']]:[[m==='forward'?'最终正向':'最终反向',m]];$('frames').replaceChildren(...series.map(([title,folder])=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),im=document.createElement('img');c.textContent=title+' / '+n+'%';a.href=folder+'/'+n+'.png';a.target='_blank';im.src=a.href;im.alt=c.textContent;a.append(im);f.append(c,a);return f}))} $('mode').onchange=()=>{const compare=$('mode').value==='compare';$('pos').min=compare?38:14;$('pos').max=compare?56:78;$('pos').value=compare?50:65;show()};$('pos').oninput=show;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='连续播放'}else{$('play').textContent='暂停';timer=setInterval(()=>{const reverse=$('mode').value==='reverse';$('pos').value=reverse?(+$('pos').value<=+$('pos').min?$('pos').max:+$('pos').value-1):(+$('pos').value>=+$('pos').max?$('pos').min:+$('pos').value+1);show()},600)}};onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){$('pos').value=+$('pos').value+(e.key==='ArrowLeft'?-1:1);show()}};show()</script></html>
