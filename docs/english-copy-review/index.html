<!doctype html><html lang="en"><meta charset="utf-8"><title>English copy review</title><style>body{background:#080a0c;color:#ddd;font:14px system-ui;margin:24px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,button{background:#202426;color:#ddd;border:1px solid #555;padding:8px}img{display:block;max-width:100%;max-height:82vh;margin:18px auto}input{width:35vw}a{color:#c9b28c}</style><header><select id="group"></select><button id="prev">Previous</button><button id="next">Next</button><input id="frame" type="range" min="0" value="0"><span id="label"></span><a href="REVIEW.md">Review notes</a></header><img id="image" alt="Browser screenshot"><script>const groups=[{"name": "desktop", "frames": [{"src": "desktop/0.png", "label": "Story 0%"}, {"src": "desktop/10.png", "label": "Story 10%"}, {"src": "desktop/18.png", "label": "Story 18%"}, {"src": "desktop/20.png", "label": "Story 20%"}, {"src": "desktop/24.png", "label": "Story 24%"}, {"src": "desktop/28.png", "label": "Story 28%"}, {"src": "desktop/30.png", "label": "Story 30%"}, {"src": "desktop/33.png", "label": "Story 33%"}, {"src": "desktop/34.5.png", "label": "Story 34.5%"}, {"src": "desktop/36.5.png", "label": "Story 36.5%"}, {"src": "desktop/38.png", "label": "Story 38%"}, {"src": "desktop/39.png", "label": "Story 39%"}, {"src": "desktop/40.png", "label": "Story 40%"}, {"src": "desktop/41.png", "label": "Story 41%"}, {"src": "desktop/42.png", "label": "Story 42%"}, {"src": "desktop/44.png", "label": "Story 44%"}, {"src": "desktop/45.5.png", "label": "Story 45.5%"}, {"src": "desktop/47.png", "label": "Story 47%"}, {"src": "desktop/50.png", "label": "Story 50%"}, {"src": "desktop/53.5.png", "label": "Story 53.5%"}, {"src": "desktop/56.png", "label": "Story 56%"}, {"src": "desktop/59.png", "label": "Story 59%"}, {"src": "desktop/62.png", "label": "Story 62%"}, {"src": "desktop/65.png", "label": "Story 65%"}, {"src": "desktop/68.png", "label": "Story 68%"}, {"src": "desktop/70.5.png", "label": "Story 70.5%"}, {"src": "desktop/72.5.png", "label": "Story 72.5%"}, {"src": "desktop/75.5.png", "label": "Story 75.5%"}, {"src": "desktop/78.png", "label": "Story 78%"}, {"src": "desktop/80.png", "label": "Story 80%"}, {"src": "desktop/82.png", "label": "Story 82%"}, {"src": "desktop/84.png", "label": "Story 84%"}, {"src": "desktop/88.png", "label": "Story 88%"}, {"src": "desktop/92.png", "label": "Story 92%"}, {"src": "desktop/94.png", "label": "Story 94%"}, {"src": "desktop/96.png", "label": "Story 96%"}, {"src": "desktop/98.png", "label": "Story 98%"}, {"src": "desktop/100.png", "label": "Story 100%"}]}, {"name": "mobile-reverse", "frames": [{"src": "mobile-reverse/100.png", "label": "Story 100%"}, {"src": "mobile-reverse/96.png", "label": "Story 96%"}, {"src": "mobile-reverse/92.png", "label": "Story 92%"}, {"src": "mobile-reverse/84.png", "label": "Story 84%"}, {"src": "mobile-reverse/82.png", "label": "Story 82%"}, {"src": "mobile-reverse/78.png", "label": "Story 78%"}, {"src": "mobile-reverse/72.5.png", "label": "Story 72.5%"}, {"src": "mobile-reverse/68.png", "label": "Story 68%"}, {"src": "mobile-reverse/65.png", "label": "Story 65%"}, {"src": "mobile-reverse/59.png", "label": "Story 59%"}, {"src": "mobile-reverse/53.5.png", "label": "Story 53.5%"}, {"src": "mobile-reverse/47.png", "label": "Story 47%"}, {"src": "mobile-reverse/45.5.png", "label": "Story 45.5%"}, {"src": "mobile-reverse/41.png", "label": "Story 41%"}, {"src": "mobile-reverse/39.png", "label": "Story 39%"}, {"src": "mobile-reverse/36.5.png", "label": "Story 36.5%"}, {"src": "mobile-reverse/33.png", "label": "Story 33%"}, {"src": "mobile-reverse/30.png", "label": "Story 30%"}, {"src": "mobile-reverse/18.png", "label": "Story 18%"}, {"src": "mobile-reverse/10.png", "label": "Story 10%"}, {"src": "mobile-reverse/0.png", "label": "Story 0%"}]}, {"name": "Sources", "frames": [{"src": "sources/sources-desktop-bottom.png", "label": "sources-desktop-bottom"}, {"src": "sources/sources-desktop-top.png", "label": "sources-desktop-top"}, {"src": "sources/sources-mobile-bottom.png", "label": "sources-mobile-bottom"}, {"src": "sources/sources-mobile-top.png", "label": "sources-mobile-top"}]}];const group=document.querySelector('#group'),frame=document.querySelector('#frame');group.innerHTML=groups.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');function show(){const f=groups[+group.value].frames;frame.max=f.length-1;const item=f[+frame.value];document.querySelector('#image').src=item.src;document.querySelector('#label').textContent=`${+frame.value+1}/${f.length} · ${item.label}`}group.onchange=()=>{frame.value=0;show()};frame.oninput=show;function step(d){frame.value=Math.max(0,Math.min(+frame.max,+frame.value+d));show()}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.onkeydown=e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)};show()</script></html>
